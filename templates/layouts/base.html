<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{block "title" .}}{{.Site.SiteName}}{{end}}</title>
<link rel="stylesheet" href="{{asset "css/output.css"}}">
{{/* ThemeColor is a validated #rrggbb (tmpl.Render enforces Rule 10). */}}
<meta name="theme-color" content="{{.Site.ThemeColor}}">
<!-- OPEN(Q11): favicon -->
<link rel="icon" href="data:,">
{{/* Phase 4b: the group's server-computed palette <style> block goes here.
     Phase 11: /manifest.json, the /sw.js registration and apple-touch-icon
     go here, when those routes exist. */}}
<script src="{{asset "js/htmx.min.js"}}"></script>
{{block "head" .}}{{end}}
</head>
<body data-look="{{.Site.Look}}" class="flex min-h-dvh flex-col">
<nav class="border-b border-line bg-surface">
  <div class="mx-auto flex min-h-14 w-full max-w-page items-center justify-between gap-4 px-4 sm:px-6">
    <a href="/" class="flex min-h-11 min-w-0 items-center gap-3 text-lg font-bold">
      {{- if eq .Site.Kind "group"}}
      {{/* No logo yet (Phase 10): a brand tile with the group's initials (design.md 3, 8). */}}
      <span aria-hidden="true" class="flex size-8 shrink-0 items-center justify-center rounded-sm bg-brand text-sm font-bold text-brand-contrast">{{.Site.Initials}}</span>
      {{- end}}
      <span class="min-w-0">{{.Site.SiteName}}</span>
    </a>
    {{/* Phase 1/3: the nav fragment (/fragments/nav) loads here, with "Log in"
         or the account menu, once those routes exist. */}}
    <div id="nav-actions"></div>
  </div>
</nav>
<main class="mx-auto flex w-full max-w-page flex-1 flex-col gap-6 px-4 py-6 sm:px-6 sm:py-8">
{{block "content" .}}{{end}}
</main>
<footer class="border-t border-line">
  <div class="mx-auto flex w-full max-w-page flex-wrap items-center gap-x-4 px-4 py-6 text-sm text-muted sm:px-6">
    <p>{{.Site.FooterText}}</p>
    {{/* Phase 12: Terms and Privacy links, when those routes exist. */}}
  </div>
</footer>
</body>
</html>
